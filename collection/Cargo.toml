[package]
name = "nft-collection"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
solana-program = "1.18"
borsh = { version = "0.10", features = ["derive"] }
spl-token = { version = "4.0", features = ["no-entrypoint"] }
mpl-token-metadata = { version = "4.1", features = ["no-entrypoint"] }